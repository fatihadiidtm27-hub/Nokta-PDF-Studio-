<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>NOKTA // PDF STUDIO</title>
<meta name="description" content="Susun e-book atau panduan digital blok demi blok, ekspor jadi PDF langsung dari browser.">
<meta name="theme-color" content="#03040a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@400;600;700&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-grid no-print"></div>
  <div class="bg-glow no-print"></div>
  <div class="bg-scan no-print"></div>

  <div class="app">

    <div class="topbar no-print">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-text glitch">NOKTA <span>//</span> PDF</div>
          <div class="brand-sub">DOCUMENT BUILD CONSOLE</div>
        </div>
      </div>
      <button class="btn primary" id="btnExportPdf">⬇ PDF</button>
    </div>

    <div class="workspace no-print">

      <div class="tool-panel">
        <div class="panel-title">📖 Sampul</div>
        <div class="field-row">
          <label>Judul</label>
          <input type="text" id="coverTitle" value="Judul E-Book Kamu">
        </div>
        <div class="field-row">
          <label>Subjudul</label>
          <input type="text" id="coverSubtitle" value="Deskripsi singkat isi buku ini">
        </div>
        <div class="field-row">
          <label>Penulis / Brand</label>
          <input type="text" id="coverAuthor" value="Nama Kamu">
        </div>
        <div class="field-row">
          <label>Gambar sampul (opsional)</label>
          <button class="btn full small" id="btnCoverImage">🖼 Pilih Gambar Sampul</button>
        </div>

        <div class="panel-title" style="margin-top:16px;">🎨 Tema Dokumen</div>
        <div class="chip-row" id="themePicker">
          <button class="chip active" data-theme="wave">NOKTAWave</button>
          <button class="chip" data-theme="editorial">Editorial Warm</button>
          <button class="chip" data-theme="mono">Minimal Mono</button>
        </div>

        <div class="panel-title" style="margin-top:16px;">➕ Tambah Blok</div>
        <div class="chip-row">
          <button class="chip block-add" data-type="heading">Judul Bagian</button>
          <button class="chip block-add" data-type="paragraph">Paragraf</button>
          <button class="chip block-add" data-type="image">Gambar</button>
          <button class="chip block-add" data-type="bullets">List</button>
          <button class="chip block-add" data-type="quote">Kutipan</button>
          <button class="chip block-add" data-type="pagebreak">Halaman Baru</button>
        </div>

        <div class="hint" style="margin-top:12px;">Judul/subjudul/penulis diatur di atas. Ketuk teks pada blok isi di area pratinjau kanan untuk mengedit langsung. Gunakan ⬆⬇✕ di atas tiap blok untuk atur urutan atau hapus.</div>
      </div>

      <div class="preview-pane">
        <div class="doc-scale-wrap">
          <div class="document" id="document">
            <!-- cover + blocks dirender oleh app.js -->
          </div>
        </div>
      </div>

    </div>

  </div>

  <input type="file" id="coverImageInput" accept="image/*" hidden>

<script src="auth-gate.js"></script>
<script src="app.js"></script>
</body>
</html>
